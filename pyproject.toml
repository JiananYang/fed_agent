[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fed-agent-prototype"
version = "0.1.0"
description = "Prototype for explainable federated multi-agent learning"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
flower = ["flwr[simulation]>=1.15.0", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["client", "server", "shared"]

[tool.flwr.app]
publisher = "local"

[tool.flwr.app.components]
serverapp = "server.flower_server:app"
clientapp = "client.federation.flower_client:app"
